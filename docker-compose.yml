services:
  app:
    build:
      context: ./python-prototype
      dockerfile: Dockerfile
    container_name: syf-app
    environment:
      STATE_FILE: /data/state.json
      DATABASE_URL: postgresql://app:app@postgres:5432/shortyourfriends
    ports:
      - "8888:8888"
    volumes:
      - app_state:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: syf-postgres
    environment:
      POSTGRES_DB: shortyourfriends
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shortyourfriends"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  app_state:
  pg_data:
